{% extends "base.html" %}
{% block title %}Sign in | Developer Academy{% endblock %}
{% block public_content %}
<div class="login-wrap">
  <form class="login-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <span class="brand-mark">SF</span>
    <h1>Sign in</h1>
    <p>Use the account provided by your academy instructor.</p>
    <label class="field"><span>Email address</span><input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label>
    <label class="field"><span>Password</span>
      <div class="input-shell">
        <input type="password" name="password" required autocomplete="current-password" placeholder="Enter your password" data-password-field>
        <button type="button" data-password-toggle aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M12 5c5.5 0 9.4 4.2 10 7-.6 2.8-4.5 7-10 7S2.6 14.8 2 12c.6-2.8 4.5-7 10-7Zm0 2c-4 0-7 2.9-7.8 5 .8 2.1 3.8 5 7.8 5s7-2.9 7.8-5C19 9.9 16 7 12 7Zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6Z"/></svg></button>
      </div>
    </label>
    <button class="btn btn-primary btn-full" type="submit">Sign in →</button>
    <p class="login-note">New here? <a class="alt-link" href="{{ url_for('register') }}">Create an account</a> — an instructor approves it before you start.</p>
  </form>
</div>
{% endblock %}
